name: build

# Two halves: the Android app with the Gradle wrapper, and the PC app with cargo. Both build on
# Linux; the PC app is also built on Windows, which is the platform it ships on.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: ./gradlew assembleDebug
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Check the APK
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk" || { echo "app-debug.apk was not produced"; exit 1; }
          ls -lh "$apk"
          listing=$(unzip -l "$apk")
          case "$listing" in
            *classes.dex*) ;;
            *) echo "$apk has no classes.dex"; exit 1 ;;
          esac
          case "$listing" in
            *AndroidManifest.xml*) ;;
            *) echo "$apk has no AndroidManifest.xml"; exit 1 ;;
          esac

  pc-linux:
    name: PC app (Linux build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4

      - name: Install egui/winit system libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-xcb-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxi-dev libxcursor-dev \
            libxrandr-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - run: ./target/release/mediapresence --selftest

      - name: Check the binary
        run: |
          set -euo pipefail
          ftype=$(file -b target/release/mediapresence)
          echo "$ftype"
          case "$ftype" in
            *ELF*) ;;
            *) echo "not a Linux ELF binary"; exit 1 ;;
          esac
          size=$(stat -c %s target/release/mediapresence)
          test "$size" -gt 1000000 || { echo "binary is only $size bytes"; exit 1; }

  pc-windows:
    name: PC app (Windows build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release --locked
      - run: target/release/mediapresence.exe --selftest

      - name: Check the exe
        shell: pwsh
        working-directory: pc
        run: |
          $exe = "target/release/mediapresence.exe"
          if (-not (Test-Path $exe)) { throw "mediapresence.exe was not produced" }
          $size = (Get-Item $exe).Length
          Write-Host "size: $size bytes"
          if ($size -lt 1000000) { throw "the exe is only $size bytes" }
