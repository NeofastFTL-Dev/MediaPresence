name: build

# Two halves, both buildable on Linux: the Android app with the Gradle wrapper, and
# the Windows tray app with dotnet publish + EnableWindowsTargeting (no Wine needed;
# build-wine.sh still exists for a real Windows SDK inside a prefix).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: ./gradlew assembleDebug
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Check the APK
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk" || { echo "app-debug.apk was not produced"; exit 1; }
          ls -lh "$apk"
          listing=$(unzip -l "$apk")
          case "$listing" in
            *classes.dex*) ;;
            *) echo "$apk has no classes.dex"; exit 1 ;;
          esac
          case "$listing" in
            *AndroidManifest.xml*) ;;
            *) echo "$apk has no AndroidManifest.xml"; exit 1 ;;
          esac

  pc:
    name: Publish PC tray app (win-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: dotnet publish (Release, win-x64, self-contained, single file)
        run: |
          set -euo pipefail
          dotnet publish pc/NeoPresence.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:EnableWindowsTargeting=true \
            -o out

      - name: Check the published exe
        run: |
          set -euo pipefail
          exe=out/NeoPresence.exe
          test -f "$exe" || { echo "NeoPresence.exe was not produced"; exit 1; }
          ls -lh "$exe"
          ftype=$(file -b "$exe")
          echo "file type: $ftype"
          case "$ftype" in
            *PE32+*) ;;
            *) echo "$exe is not a PE32+ Windows binary"; exit 1 ;;
          esac
          size=$(stat -c %s "$exe")
          test "$size" -gt 1000000 \
            || { echo "$exe is only $size bytes - the self-contained runtime is missing"; exit 1; }
