name: build

# Two halves: the Android app with the Gradle wrapper, and the PC app with cargo. Both build on
# Linux; the PC app is also built on Windows, which is the platform it ships on.
on:
  push:
    branches: [main, linux, macos]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: ./gradlew assembleDebug
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Check the APK
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk" || { echo "app-debug.apk was not produced"; exit 1; }
          ls -lh "$apk"
          listing=$(unzip -l "$apk")
          case "$listing" in
            *classes.dex*) ;;
            *) echo "$apk has no classes.dex"; exit 1 ;;
          esac
          case "$listing" in
            *AndroidManifest.xml*) ;;
            *) echo "$apk has no AndroidManifest.xml"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: mediapresence-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  pc-linux:
    name: PC app (Linux build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4

      - name: Install egui/winit system libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-xcb-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxi-dev libxcursor-dev \
            libxrandr-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - run: ./target/release/mediapresence --selftest

      - name: Check the binary
        run: |
          set -euo pipefail
          ftype=$(file -b target/release/mediapresence)
          echo "$ftype"
          case "$ftype" in
            *ELF*) ;;
            *) echo "not a Linux ELF binary"; exit 1 ;;
          esac
          size=$(stat -c %s target/release/mediapresence)
          test "$size" -gt 1000000 || { echo "binary is only $size bytes"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: mediapresence-pc-linux-x86_64
          path: pc/target/release/mediapresence
          if-no-files-found: error

  pc-windows:
    name: PC app (Windows build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release --locked
      - run: target/release/mediapresence.exe --selftest

      - name: Check the exe
        shell: pwsh
        working-directory: pc
        run: |
          $exe = "target/release/mediapresence.exe"
          if (-not (Test-Path $exe)) { throw "mediapresence.exe was not produced" }
          $size = (Get-Item $exe).Length
          Write-Host "size: $size bytes"
          if ($size -lt 1000000) { throw "the exe is only $size bytes" }

      - uses: actions/upload-artifact@v4
        with:
          name: mediapresence-pc-windows
          path: pc/target/release/mediapresence.exe
          if-no-files-found: error

  pc-macos:
    name: PC app (macOS build)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pc

      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - run: ./target/release/mediapresence --selftest

      - name: Check the binary
        run: |
          set -euo pipefail
          ftype=$(file -b target/release/mediapresence)
          echo "$ftype"
          case "$ftype" in
            *Mach-O*) ;;
            *) echo "not a Mach-O binary"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: mediapresence-pc-macos
          path: pc/target/release/mediapresence
          if-no-files-found: error

  release:
    name: Release
    needs: [android, pc-linux, pc-windows, pc-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mediapresence-pc-linux-x86_64
          path: dist/linux
      - uses: actions/download-artifact@v4
        with:
          name: mediapresence-pc-macos
          path: dist/macos
      - uses: actions/download-artifact@v4
        with:
          name: mediapresence-pc-windows
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          name: mediapresence-android
          path: dist/android

      - name: Name the binaries after the tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -s dist/linux/mediapresence
          test -s dist/macos/mediapresence
          test -s dist/windows/mediapresence.exe
          test -s dist/android/app-debug.apk
          mkdir -p out
          cp dist/linux/mediapresence "out/mediapresence-${version}-linux-x86_64"
          cp dist/macos/mediapresence "out/mediapresence-${version}-macos"
          cp dist/windows/mediapresence.exe "out/mediapresence-${version}-windows-x86_64.exe"
          cp dist/android/app-debug.apk "out/mediapresence-${version}-android-debug.apk"
          chmod 755 out/mediapresence-*
          ls -l out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          name: MediaPresence ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Android phone to Discord rich presence, over wifi.

            Attached: the PC app for Windows x86_64, Linux x86_64 and macOS, plus the Android
            companion APK. The Android APK is a **debug** build because release signing needs the
            local `android/keystore.properties`; it installs and runs the same as a release build.
